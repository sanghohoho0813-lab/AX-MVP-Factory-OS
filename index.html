<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="MIRAE AI LAB OS — 미래AI랩의 고객 운영·업무 일기·AX 스튜디오를 한곳에서 다루는 내부 운영 시스템"
    />
    <title>MIRAE AI LAB OS</title>
    <script>
      /* 렌더 전 저장된 화면 설정(글자 크기·테마·모션)을 적용해 깜빡임을 막는다. 손상 시 기본값. */
      (function () {
        var el = document.documentElement
        var THEMES = [
          'navy-blue', 'navy-gold', 'emerald-gold', 'forest-sage', 'deep-teal',
          'onyx-gold', 'burgundy', 'plum-indigo', 'steel',
        ]
        var scale = 'default'
        var theme = 'deep-teal'
        var motion = 'full'
        try {
          var raw = localStorage.getItem('axmvp.ui.preferences')
          if (raw) {
            var p = JSON.parse(raw)
            if (p.textScale === 'large' || p.textScale === 'extra_large') scale = p.textScale
            if (THEMES.indexOf(p.theme) !== -1) theme = p.theme
            if (p.motion === 'reduced') motion = 'reduced'
          }
        } catch (e) {
          /* 손상된 설정은 무시하고 기본값을 쓴다 */
        }
        el.setAttribute('data-text-scale', scale)
        el.setAttribute('data-theme', theme)
        el.setAttribute('data-motion', motion)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
