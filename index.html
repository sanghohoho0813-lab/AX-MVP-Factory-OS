<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- D-581 주소를 보냈을 때(카카오톡 · 문자 미리보기) 뜨는 설명 — 고객에게 보내도 맞는 말로. 제품 이름은 그대로(대표 결정 대기) -->
    <meta name="description" content="컨설턴트의 고객 · 서류 · 일정 · 마케팅을 한곳에서 챙기는 업무 프로그램" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MIRAE AI LAB OS" />
    <meta property="og:description" content="컨설턴트의 고객 · 서류 · 일정 · 마케팅을 한곳에서 챙기는 업무 프로그램" />
    <title>MIRAE AI LAB OS</title>
    <script>
      /* 렌더 전 저장된 화면 설정(글자 크기·테마·모션)을 적용해 깜빡임을 막는다. 손상 시 기본값. */
      (function () {
        var el = document.documentElement
        var THEMES = [
          'navy-blue', 'navy-gold', 'emerald-gold', 'forest-sage', 'deep-teal',
          'onyx-gold', 'burgundy', 'plum-indigo', 'steel',
        ]
        var scale = 'default'
        var theme = 'onyx-gold'
        var motion = 'full'
        try {
          var raw = localStorage.getItem('axmvp.ui.preferences')
          if (raw) {
            var p = JSON.parse(raw)
            if (p.textScale === 'large' || p.textScale === 'extra_large') scale = p.textScale
            if (THEMES.indexOf(p.theme) !== -1) theme = p.theme
            /* D-186: 예전 기본값(딥 틸)이 저절로 저장된 것은 새 기본(오닉스 골드)으로 — 직접 고른 것(themeChosen)만 그대로 */
            if (theme === 'deep-teal' && p.themeChosen !== true) theme = 'onyx-gold'
            if (p.motion === 'reduced') motion = 'reduced'
          }
        } catch (e) {
          /* 손상된 설정은 무시하고 기본값을 쓴다 */
        }
        el.setAttribute('data-text-scale', scale)
        el.setAttribute('data-theme', theme)
        el.setAttribute('data-motion', motion)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
