<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="AX MVP Factory OS — 진단부터 현장검증, 자금조달 자료화까지 관리하는 내부 운영 시스템"
    />
    <title>AX MVP Factory OS</title>
    <script>
      /* 렌더 전 저장된 글자 크기 설정을 적용해 깜빡임을 막는다. 손상 시 기본(1.5)로 복구. */
      (function () {
        try {
          var raw = localStorage.getItem('axmvp.ui.preferences')
          var scale = 'default'
          if (raw) {
            var v = JSON.parse(raw).textScale
            if (v === 'large' || v === 'extra_large') scale = v
          }
          document.documentElement.setAttribute('data-text-scale', scale)
        } catch (e) {
          document.documentElement.setAttribute('data-text-scale', 'default')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
